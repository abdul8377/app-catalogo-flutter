name: Apply product stepper fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-product-flow-stepper
          fetch-depth: 0

      - name: Apply focused UI changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          page_path = Path('lib/features/catalogo/presentation/pages/producto_form_page.dart')
          page = page_path.read_text(encoding='utf-8')

          old_header = """              if (state.paso < 3)
                _StepIndicator(
                  paso: state.paso,
                  tipoRegistro: state.tipoRegistro,
                ),"""
          new_header = """              _StepIndicator(
                paso: state.paso,
                tipoRegistro: state.tipoRegistro,
              ),"""
          if old_header in page:
              page = page.replace(old_header, new_header, 1)

          pattern = re.compile(
              r"  @override\n  Widget build\(BuildContext context\) => LayoutBuilder\(\n"
              r".*?\n  \);\n}\n\nclass _PasoActual",
              re.S,
          )
          replacement = """  @override
  Widget build(BuildContext context) => LayoutBuilder(
    builder: (context, constraints) {
      final horizontalPadding = constraints.maxWidth < 500 ? 16.0 : 28.0;
      return Container(
        width: double.infinity,
        padding: EdgeInsets.fromLTRB(
          horizontalPadding,
          14,
          horizontalPadding,
          16,
        ),
        color: Colors.white,
        child: Column(
          crossAxisAlignment: CrossAxisAlignment.start,
          children: [
            Center(
              child: ConstrainedBox(
                constraints: const BoxConstraints(maxWidth: 760),
                child: Row(
                  children: [
                    for (var index = 0; index < 7; index++) ...[
                      if (index > 0)
                        Expanded(
                          child: Container(
                            height: 2,
                            color: index <= paso
                                ? const Color(0xFFFFC500)
                                : const Color(0xFFE0E0E0),
                          ),
                        ),
                      Tooltip(
                        message: 'Ir al paso ${index + 1}: ${_nombres[index]}',
                        child: Semantics(
                          button: true,
                          selected: index == paso,
                          label: 'Paso ${index + 1}: ${_nombres[index]}',
                          child: Material(
                            color: Colors.transparent,
                            shape: const CircleBorder(),
                            child: InkWell(
                              key: ValueKey('paso_flujo_${index + 1}'),
                              customBorder: const CircleBorder(),
                              onTap: () => context
                                  .read<ProductoFormBloc>()
                                  .add(ProductoFormPasoSeleccionado(index)),
                              child: Container(
                                width: 32,
                                height: 32,
                                decoration: BoxDecoration(
                                  shape: BoxShape.circle,
                                  color: index <= paso
                                      ? const Color(0xFFFFC500)
                                      : Colors.white,
                                  border: Border.all(
                                    color: index <= paso
                                        ? const Color(0xFFFFC500)
                                        : const Color(0xFFD0D5DD),
                                    width: 2,
                                  ),
                                ),
                                alignment: Alignment.center,
                                child: Text(
                                  '${index + 1}',
                                  style: GoogleFonts.inter(
                                    color: const Color(0xFF1A1A1A),
                                    fontSize: 12,
                                    fontWeight: FontWeight.w800,
                                  ),
                                ),
                              ),
                            ),
                          ),
                        ),
                      ),
                    ],
                  ],
                ),
              ),
            ),
            SizedBox(height: constraints.maxWidth < 500 ? 12 : 16),
            Text(
              _nombreActual,
              style: GoogleFonts.inter(
                color: const Color(0xFF1A1A1A),
                fontSize: constraints.maxWidth < 500 ? 18 : 20,
                fontWeight: FontWeight.w800,
              ),
            ),
            const SizedBox(height: 4),
            Text(
              _subtituloActual,
              style: GoogleFonts.inter(
                color: const Color(0xFF667085),
                fontSize: 14,
              ),
            ),
          ],
        ),
      );
    },
  );
}

class _PasoActual"""
          page, count = pattern.subn(replacement, page, count=1)
          if count != 1:
              raise SystemExit('No se pudo reemplazar el indicador de pasos.')
          page_path.write_text(page, encoding='utf-8')

          single_path = Path('lib/features/catalogo/presentation/widgets/producto_unico_step.dart')
          single = single_path.read_text(encoding='utf-8')
          old_layout = """        LayoutBuilder(
          builder: (context, constraints) {
            final compact = constraints.maxWidth < 1020;
            if (compact) {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.stretch,
                children: [
                  _buildSingleProductCard(),
                  const SizedBox(height: 18),
                  _buildSingleInformationPanel(),
                ],
              );
            }
            return Row(
              crossAxisAlignment: CrossAxisAlignment.start,
              children: [
                Expanded(flex: 7, child: _buildSingleProductCard()),
                const SizedBox(width: 20),
                Expanded(flex: 3, child: _buildSingleInformationPanel()),
              ],
            );
          },
        ),"""
          if old_layout not in single:
              raise SystemExit('No se encontró el panel informativo del producto único.')
          single = single.replace(old_layout, '        _buildSingleProductCard(),', 1)
          single_path.write_text(single, encoding='utf-8')

          test_path = Path('test/producto_form_page_test.dart')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              "      expect(find.text('Se define en este paso'), findsOneWidget);\n"
              "      expect(find.text('Se configura después'), findsOneWidget);",
              "      expect(find.text('Se define en este paso'), findsNothing);\n"
              "      expect(find.text('Se configura después'), findsNothing);",
              1,
          )

          anchor = """  testWidgets('los pasos 1 y 2 conservan el nuevo diseño y su flujo', (
"""
          navigation_test = """  testWidgets('el indicador permanece visible y permite navegar por número', (
    tester,
  ) async {
    await tester.binding.setSurfaceSize(const Size(1000, 900));
    addTearDown(() => tester.binding.setSurfaceSize(null));

    await tester.pumpWidget(
      RepositoryProvider<CatalogoRepository>.value(
        value: _FakeCatalogoRepository(),
        child: const MaterialApp(home: ProductoFormPage()),
      ),
    );
    await tester.pumpAndSettle();

    final bloc = tester.element(find.byType(Scaffold)).read<ProductoFormBloc>();
    expect(find.byKey(const ValueKey('paso_flujo_1')), findsOneWidget);
    expect(find.byKey(const ValueKey('paso_flujo_7')), findsOneWidget);

    await tester.tap(find.byKey(const ValueKey('paso_flujo_4')));
    await tester.pumpAndSettle();
    expect(bloc.state.paso, 3);
    expect(find.byKey(const ValueKey('paso_flujo_1')), findsOneWidget);
    expect(find.byKey(const ValueKey('paso_flujo_7')), findsOneWidget);

    await tester.tap(find.byKey(const ValueKey('paso_flujo_2')));
    await tester.pumpAndSettle();
    expect(bloc.state.paso, 1);
    expect(tester.takeException(), isNull);
  });

"""
          if navigation_test not in tests:
              tests = tests.replace(anchor, navigation_test + anchor, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed files
        run: dart format lib/features/catalogo/presentation/pages/producto_form_page.dart lib/features/catalogo/presentation/widgets/producto_unico_step.dart test/producto_form_page_test.dart

      - name: Run product form tests
        run: flutter test test/producto_form_page_test.dart

      - name: Commit generated fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/catalogo/presentation/pages/producto_form_page.dart \
            lib/features/catalogo/presentation/widgets/producto_unico_step.dart \
            test/producto_form_page_test.dart
          git commit -m "corrige navegación del flujo de productos"
          git push origin HEAD:agent/fix-product-flow-stepper
