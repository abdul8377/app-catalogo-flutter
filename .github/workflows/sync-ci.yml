name: Flutter Sync CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Flutter estable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencias
        run: flutter pub get
      - name: Pruebas de sincronización
        run: flutter test test/features/sync
