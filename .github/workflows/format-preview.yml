name: Format Preview

on:
  push:
    branches:
      - feature/sync-price-lists

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - name: Show formatted migration
        run: dart format --output=show lib/core/database/migrations/price_list_migration.dart
